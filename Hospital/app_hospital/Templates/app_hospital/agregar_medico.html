{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Medico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'app_hospital/styles.css' %}">
</head>
<body>
    <div class="container py-4">

        <div class="page-header mb-4">
            <h1>Agregar Medico</h1>
        </div>

        <div class="hospital-form">
            <form method="POST">
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ medico.nombre }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="apellido" class="form-control" value="{{ medico.apellido }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Matricula</label>
                        <input type="text" name="matricula" class="form-control" value="{{ medico.matricula }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Telefono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ medico.telefono }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Especialidad</label>
                        <select name="id_especialidad" class="form-select">
                            {% for especialidad in especialidades %}
                            <option value="{{ especialidad.id_especialidad }}">
                                {{ especialidad.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <input type="text" name="estado" class="form-control" value="{{ medico.estado }}">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-hospital">Guardar Cambios</button>
                    <a href="/medicos/" class="btn btn-outline-hospital">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
