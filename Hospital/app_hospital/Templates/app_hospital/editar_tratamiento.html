{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Tratamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'app_hospital/styles.css' %}">
</head>
<body>
    <div class="container py-4">

        <div class="page-header mb-4">
            <h1>Modificar Tratamiento</h1>
        </div>

        <div class="hospital-form">
            <form method="POST">
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Paciente</label>
                        <select name="id_paciente" class="form-select">
                            {% for paciente in pacientes %}
                            <option value="{{ paciente.id_paciente }}"
                                {% if paciente.id_paciente == tratamiento.id_paciente %}selected{% endif %}>
                                {{ paciente.nombre }} {{ paciente.apellido }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Medico</label>
                        <select name="id_medico" class="form-select">
                            {% for medico in medicos %}
                            <option value="{{ medico.id_medico }}"
                                {% if medico.id_medico == tratamiento.id_medico %}selected{% endif %}>
                                {{ medico.nombre }} {{ medico.apellido }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripcion</label>
                        <input type="text" name="descripcion" class="form-control" value="{{ tratamiento.descripcion }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha Inicio</label>
                        <input type="date" name="fecha_inicio" class="form-control" value="{{ tratamiento.fecha_inicio|date:'Y-m-d' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha Fin</label>
                        <input type="date" name="fecha_fin" class="form-control" value="{{ tratamiento.fecha_fin|date:'Y-m-d' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observaciones</label>
                        <textarea name="observaciones" rows="3" class="form-control">{{ tratamiento.observaciones }}</textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <input type="text" name="estado" class="form-control" value="{{ tratamiento.estado }}">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-hospital">Guardar Cambios</button>
                    <a href="/tratamientos/" class="btn btn-outline-hospital">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
