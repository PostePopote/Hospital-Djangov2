{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'app_hospital/styles.css' %}">
</head>
<body>
    <div class="container py-4">

        <div class="page-header mb-4">
            <h1>Agregar Paciente</h1>
        </div>

        <div class="hospital-form">
            <form method="POST">
                {% csrf_token %}

                <div class="form-section">
                    <div class="form-section-title">Datos personales</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" class="form-control" value="{{ paciente.nombre }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellido</label>
                            <input type="text" name="apellido" class="form-control" value="{{ paciente.apellido }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">DNI</label>
                            <input type="text" name="dni" class="form-control" value="{{ paciente.dni }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha de Nacimiento</label>
                            <input type="date" name="fecha_nacimiento" class="form-control" value="{{ paciente.fecha_nacimiento|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sexo</label>
                            <input type="text" name="sexo" class="form-control" value="{{ paciente.sexo }}">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">Contacto</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Direccion</label>
                            <input type="text" name="direccion" class="form-control" value="{{ paciente.direccion }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Telefono</label>
                            <input type="text" name="telefono" class="form-control" value="{{ paciente.telefono }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ paciente.email }}">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">Datos medicos y administrativos</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Grupo Sanguineo</label>
                            <input type="text" name="grupo_sanguineo" class="form-control" value="{{ paciente.grupo_sanguineo }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Contacto de Emergencia</label>
                            <input type="text" name="contacto_emergencia" class="form-control" value="{{ paciente.contacto_emergencia }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Telefono de Emergencia</label>
                            <input type="text" name="telefono_emergencia" class="form-control" value="{{ paciente.telefono_emergencia }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Obra Social</label>
                            <input type="text" name="obra_social" class="form-control" value="{{ paciente.obra_social }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Numero de Afiliado</label>
                            <input type="text" name="numero_afiliado" class="form-control" value="{{ paciente.numero_afiliado }}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Fecha de Alta</label>
                            <input type="date" name="fecha_alta" class="form-control" value="{{ paciente.fecha_alta|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Estado</label>
                            <input type="text" name="estado" class="form-control" value="{{ paciente.estado }}">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-hospital">Guardar Cambios</button>
                <a href="/pacientes/" class="btn btn-outline-hospital">Cancelar</a>
            </form>
        </div>

    </div>
</body>
</html>
